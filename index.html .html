<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="weather-app">

        <div class="toolbar">
            <button id="lang-btn" type="button">العربية</button>
            <button id="theme-btn" type="button" aria-label="Theme"></button>
        </div>

        <header class="header">
            <h1 data-i18n="title">Weather App</h1>
            <p data-i18n="subtitle">Discover the weather in your city</p>
        </header>

        <section class="search-section">
            <input type="text" id="city-input" data-i18n-ph="placeholder" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn" data-i18n="search">Search</button>
        </section>

        <section class="current-weather">
            <h2 id="city-name" data-i18n="loading">Loading...</h2>
            <div class="current-icon" id="current-weather-icon"></div>
            <div class="temperature">
                <span id="temperature">--°C</span>
            </div>
            <p id="weather-description" data-i18n="loadingWeather">Loading weather...</p>
            <p id="feels-like">--</p>

            <div class="weather-details">
                <div class="detail">
                    <span data-i18n="humidity">Humidity</span>
                    <p id="humidity">--%</p>
                </div>
                <div class="detail">
                    <span data-i18n="wind">Wind Speed</span>
                    <p id="wind-speed">--</p>
                </div>
            </div>
        </section>

        <section class="hourly-section">
            <div class="section-heading">
                <h2 data-i18n="hourly">Hourly Forecast</h2>
                <span data-i18n="next24">Next 24 hours</span>
            </div>
            <div class="hourly-container" id="hourly-container">
                <p data-i18n="loadingHourly">Loading hourly forecast...</p>
            </div>
        </section>

        <section class="sun-section">
            <h2 data-i18n="sunTitle">Sunrise &amp; Sunset</h2>

            <div class="sun-times">
                <div class="sun-time-item">
                    <span class="sun-symbol" data-icon="sunrise"></span>
                    <div>
                        <span class="sun-label" data-i18n="sunrise">Sunrise</span>
                        <p id="sunrise-time">--:--</p>
                    </div>
                </div>

                <div class="sun-time-item">
                    <span class="sun-symbol" data-icon="sunset"></span>
                    <div>
                        <span class="sun-label" data-i18n="sunset">Sunset</span>
                        <p id="sunset-time">--:--</p>
                    </div>
                </div>
            </div>

            <div class="sun-progress-area">
                <div class="sun-progress-track">
                    <div class="sun-progress-fill" id="sun-progress-fill"></div>
                    <div class="sun-progress-dot" id="sun-progress-dot"></div>
                </div>
                <div class="sun-progress-labels">
                    <span id="day-length">--</span>
                    <span id="sun-progress-text">--</span>
                </div>
            </div>
        </section>

        <section class="forecast-section">
            <h2 data-i18n="forecast">7-Day Forecast</h2>
            <div class="forecast-container" id="forecast-container">
                <p data-i18n="loadingForecast">Loading forecast...</p>
            </div>
        </section>

    </main>

    <script>
        // HTML ELEMENTS

        const cityInput = document.getElementById("city-input");
        const searchButton = document.getElementById("search-btn");
        const langButton = document.getElementById("lang-btn");
        const themeButton = document.getElementById("theme-btn");

        const cityName = document.getElementById("city-name");
        const currentIcon = document.getElementById("current-weather-icon");
        const temperature = document.getElementById("temperature");
        const weatherDescription = document.getElementById("weather-description");
        const feelsLike = document.getElementById("feels-like");
        const humidity = document.getElementById("humidity");
        const windSpeed = document.getElementById("wind-speed");

        const hourlyContainer = document.getElementById("hourly-container");
        const forecastContainer = document.getElementById("forecast-container");

        const sunriseTime = document.getElementById("sunrise-time");
        const sunsetTime = document.getElementById("sunset-time");
        const dayLength = document.getElementById("day-length");
        const sunProgressFill = document.getElementById("sun-progress-fill");
        const sunProgressDot = document.getElementById("sun-progress-dot");
        const sunProgressText = document.getElementById("sun-progress-text");

        // LANGUAGE

        const I18N = {
            en: {
                title: "Weather App", subtitle: "Discover the weather in your city",
                placeholder: "Enter city name...", search: "Search", searching: "Searching...",
                loading: "Loading...", loadingWeather: "Loading weather...",
                loadingHourly: "Loading hourly forecast...", loadingForecast: "Loading forecast...",
                humidity: "Humidity", wind: "Wind Speed", kmh: "km/h",
                feels: "Feels like", hourly: "Hourly Forecast", next24: "Next 24 hours",
                now: "Now", rain: "rain", unavailable: "Hourly forecast unavailable.",
                sunTitle: "Sunrise & Sunset", sunrise: "Sunrise", sunset: "Sunset",
                daylight: "Daylight", h: "h", m: "m",
                before: "Before sunrise", after: "After sunset", ofDaylight: "of daylight",
                forecast: "7-Day Forecast", unknown: "Unknown weather",
                toggle: "العربية", locale: "en-US", geo: "en",
                codes: {
                    0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast",
                    45: "Fog", 48: "Depositing rime fog", 51: "Light drizzle", 53: "Moderate drizzle",
                    55: "Dense drizzle", 56: "Freezing drizzle", 57: "Dense freezing drizzle",
                    61: "Slight rain", 63: "Moderate rain", 65: "Heavy rain", 66: "Freezing rain",
                    67: "Heavy freezing rain", 71: "Slight snow", 73: "Moderate snow", 75: "Heavy snow",
                    77: "Snow grains", 80: "Slight rain showers", 81: "Moderate rain showers",
                    82: "Violent rain showers", 85: "Slight snow showers", 86: "Heavy snow showers",
                    95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Heavy thunderstorm with hail"
                }
            },
            ar: {
                title: "تطبيق الطقس", subtitle: "اكتشف حالة الطقس في مدينتك",
                placeholder: "أدخل اسم المدينة...", search: "بحث", searching: "جارٍ البحث...",
                loading: "جارٍ التحميل...", loadingWeather: "جارٍ تحميل الطقس...",
                loadingHourly: "جارٍ تحميل التوقعات بالساعة...", loadingForecast: "جارٍ تحميل التوقعات...",
                humidity: "الرطوبة", wind: "سرعة الرياح", kmh: "كم/س",
                feels: "الإحساس", hourly: "التوقعات بالساعة", next24: "الـ 24 ساعة القادمة",
                now: "الآن", rain: "مطر", unavailable: "التوقعات بالساعة غير متوفرة.",
                sunTitle: "الشروق والغروب", sunrise: "الشروق", sunset: "الغروب",
                daylight: "ضوء النهار", h: "س", m: "د",
                before: "قبل الشروق", after: "بعد الغروب", ofDaylight: "من النهار",
                forecast: "توقعات 7 أيام", unknown: "طقس غير معروف",
                toggle: "English", locale: "ar-SA-u-nu-latn", geo: "ar",
                codes: {
                    0: "سماء صافية", 1: "صافٍ غالباً", 2: "غائم جزئياً", 3: "غائم كلياً",
                    45: "ضباب", 48: "ضباب متجمد", 51: "رذاذ خفيف", 53: "رذاذ معتدل",
                    55: "رذاذ كثيف", 56: "رذاذ متجمد", 57: "رذاذ متجمد كثيف",
                    61: "مطر خفيف", 63: "مطر معتدل", 65: "مطر غزير", 66: "مطر متجمد",
                    67: "مطر متجمد غزير", 71: "ثلج خفيف", 73: "ثلج معتدل", 75: "ثلج كثيف",
                    77: "حبيبات ثلج", 80: "زخات مطر خفيفة", 81: "زخات مطر معتدلة",
                    82: "زخات مطر عنيفة", 85: "زخات ثلج خفيفة", 86: "زخات ثلج كثيفة",
                    95: "عاصفة رعدية", 96: "عاصفة رعدية مع برد", 99: "عاصفة رعدية شديدة مع برد"
                }
            }
        };

        let lang = localStorage.getItem("lang") === "ar" ? "ar" : "en";
        let theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
        let lastQuery = "Jeddah";

        const t = key => I18N[lang][key];

        function applyLanguage() {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
            document.querySelectorAll("[data-i18n]").forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll("[data-i18n-ph]").forEach(el => {
                el.placeholder = t(el.dataset.i18nPh);
            });
            langButton.textContent = t("toggle");
            searchButton.textContent = t("search");
            feelsLike.textContent = `${t("feels")} --°`;
            windSpeed.textContent = `-- ${t("kmh")}`;
            dayLength.textContent = `${t("daylight")}: --`;
        }

        function applyTheme() {
            document.documentElement.dataset.theme = theme;
            themeButton.innerHTML = svg(theme === "dark" ? ICONS.sun : ICONS.moon);
        }

        langButton.addEventListener("click", () => {
            lang = lang === "en" ? "ar" : "en";
            localStorage.setItem("lang", lang);
            applyLanguage();
            searchCity(lastQuery);
        });

        themeButton.addEventListener("click", () => {
            theme = theme === "dark" ? "light" : "dark";
            localStorage.setItem("theme", theme);
            applyTheme();
        });

        // WEATHER DESCRIPTIONS

        function getWeatherDescription(code) {
            return I18N[lang].codes[code] || t("unknown");
        }

        // WEATHER ICONS (SVG)

        const svg = body =>
            `<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;

        const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>';
        const MOON = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
        const CLOUD = '<path d="M7 19a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9.5 4.8 4.8 0 0 1 17.5 19z"/>';
        const CLOUD_TOP = '<path d="M6.5 14a3.5 3.5 0 0 1-.3-7A5.5 5.5 0 0 1 16.8 6 4 4 0 0 1 17.5 14z"/>';

        const ICONS = {
            sun: SUN,
            moon: MOON,
            partlyDay: '<circle cx="8" cy="8" r="2.8"/><path d="M8 2.5v1M2.5 8h1M4 4l.8.8M12 4l-.8.8"/><path d="M8.5 20a3.5 3.5 0 0 1-.4-7A5 5 0 0 1 17.8 13.5 3.3 3.3 0 0 1 17.5 20z"/>',
            partlyNight: '<path d="M10 4.5a4 4 0 1 0 4.5 5.5A4 4 0 0 1 10 4.5z"/><path d="M8.5 20a3.5 3.5 0 0 1-.4-7A5 5 0 0 1 17.8 13.5 3.3 3.3 0 0 1 17.5 20z"/>',
            cloud: CLOUD,
            fog: '<path d="M4 8h16M3 12h18M5 16h14M8 20h8"/>',
            drizzle: CLOUD_TOP + '<path d="M8 17.5v1.5M12 17.5v1.5M16 17.5v1.5"/>',
            rain: CLOUD_TOP + '<path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/>',
            snow: CLOUD_TOP + '<path d="M8 18h.01M12 20h.01M16 18h.01" stroke-width="2.6"/>',
            storm: CLOUD_TOP + '<path d="M12.5 14l-2.5 3.5h3L11 21"/>',
            temp: '<path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/>',
            sunrise: '<path d="M5 18a7 7 0 0 1 14 0M2 18h20M12 5v6M9 8l3-3 3 3"/>',
            sunset: '<path d="M5 18a7 7 0 0 1 14 0M2 18h20M12 5v6M9 8l3 3 3-3"/>'
        };

        function getWeatherIcon(code, isDay = 1) {
            let key = "temp";
            if (code === 0) key = isDay ? "sun" : "moon";
            else if (code === 1) key = isDay ? "partlyDay" : "moon";
            else if (code === 2) key = isDay ? "partlyDay" : "partlyNight";
            else if (code === 3) key = "cloud";
            else if ([45, 48].includes(code)) key = "fog";
            else if ([51, 53, 55, 56, 57].includes(code)) key = "drizzle";
            else if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) key = "rain";
            else if ([71, 73, 75, 77, 85, 86].includes(code)) key = "snow";
            else if ([95, 96, 99].includes(code)) key = "storm";
            return svg(ICONS[key]);
        }

        // SEARCH CITY

        async function searchCity(city) {
            const query = city.trim();

            if (!query) {
                return;
            }

            lastQuery = query;
            searchButton.disabled = true;
            searchButton.textContent = t("searching");

            try {
                const url =
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=${t("geo")}&format=json`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("City search failed.");
                }

                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    return;
                }

                const found = data.results[0];

                await getWeather(
                    found.latitude,
                    found.longitude,
                    found.name,
                    found.country
                );

            } catch (error) {
                console.error("Search error:", error);
            } finally {
                searchButton.disabled = false;
                searchButton.textContent = t("search");
            }
        }

        // GET WEATHER DATA

        async function getWeather(latitude, longitude, name, country) {
            try {
                const url =
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=7`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Weather request failed.");
                }

                const data = await response.json();

                if (!data.current || !data.hourly || !data.daily) {
                    throw new Error("Invalid weather data.");
                }

                displayCurrentWeather(data, name, country);
                displayHourlyForecast(data.hourly, data.current.time);
                displaySunInformation(data);
                displayForecast(data.daily);

            } catch (error) {
                console.error("Weather error:", error);
            }
        }

        // CURRENT WEATHER

        function displayCurrentWeather(data, name, country) {
            const current = data.current;

            cityName.textContent = country ? `${name}, ${country}` : name;

            currentIcon.innerHTML = getWeatherIcon(
                current.weather_code,
                current.is_day
            );

            temperature.textContent = `${Math.round(current.temperature_2m)}°C`;
            weatherDescription.textContent = getWeatherDescription(current.weather_code);
            feelsLike.textContent = `${t("feels")} ${Math.round(current.apparent_temperature)}°`;
            humidity.textContent = `${current.relative_humidity_2m}%`;
            windSpeed.textContent = `${current.wind_speed_10m} ${t("kmh")}`;
        }

        // HOURLY FORECAST

        function displayHourlyForecast(hourly, currentTime) {
            hourlyContainer.innerHTML = "";

            const currentIndex = hourly.time.indexOf(currentTime);

            const startIndex = currentIndex >= 0
                ? currentIndex
                : hourly.time.findIndex(time => time >= currentTime);

            if (startIndex < 0) {
                hourlyContainer.textContent = t("unavailable");
                return;
            }

            const endIndex = Math.min(startIndex + 24, hourly.time.length);

            for (let i = startIndex; i < endIndex; i++) {
                const hourLabel = hourly.time[i].slice(11, 16);
                const isCurrentHour = i === startIndex;

                const card = document.createElement("div");
                card.className = "hourly-card";

                if (isCurrentHour) {
                    card.classList.add("active-hour");
                }

                const time = document.createElement("span");
                time.className = "hourly-time";
                time.textContent = isCurrentHour ? t("now") : hourLabel;

                const icon = document.createElement("div");
                icon.className = "hourly-icon";
                icon.innerHTML = getWeatherIcon(
                    hourly.weather_code[i],
                    hourly.is_day[i]
                );

                const temp = document.createElement("strong");
                temp.className = "hourly-temperature";
                temp.textContent = `${Math.round(hourly.temperature_2m[i])}°`;

                const rain = document.createElement("span");
                rain.className = "hourly-rain";
                rain.textContent = `${hourly.precipitation_probability[i] ?? 0}% ${t("rain")}`;

                card.append(time, icon, temp, rain);
                hourlyContainer.appendChild(card);
            }
        }

        // SUNRISE AND SUNSET

        function getMinutesFromTime(timeString) {
            const parts = timeString.slice(11, 16).split(":");
            return Number(parts[0]) * 60 + Number(parts[1]);
        }

        function displaySunInformation(data) {
            const sunrise = data.daily.sunrise[0];
            const sunset = data.daily.sunset[0];

            const sunriseMinutes = getMinutesFromTime(sunrise);
            const sunsetMinutes = getMinutesFromTime(sunset);
            const currentMinutes = getMinutesFromTime(data.current.time);

            const totalDaylight = sunsetMinutes - sunriseMinutes;

            if (totalDaylight <= 0) return;

            const elapsedMinutes = currentMinutes - sunriseMinutes;

            const progress = Math.max(
                0,
                Math.min(100, (elapsedMinutes / totalDaylight) * 100)
            );

            const hours = Math.floor(totalDaylight / 60);
            const minutes = totalDaylight % 60;

            sunriseTime.textContent = sunrise.slice(11, 16);
            sunsetTime.textContent = sunset.slice(11, 16);
            dayLength.textContent = `${t("daylight")}: ${hours}${t("h")} ${minutes}${t("m")}`;

            sunProgressFill.style.width = `${progress}%`;
            sunProgressDot.style.left = `${progress}%`;

            if (currentMinutes < sunriseMinutes) {
                sunProgressText.textContent = t("before");
            } else if (currentMinutes >= sunsetMinutes) {
                sunProgressText.textContent = t("after");
            } else {
                sunProgressText.textContent = `${Math.round(progress)}% ${t("ofDaylight")}`;
            }
        }

        // 7-DAY FORECAST

        function displayForecast(daily) {
            forecastContainer.innerHTML = "";

            for (let i = 0; i < daily.time.length; i++) {
                const date = new Date(`${daily.time[i]}T12:00:00`);

                const dayName = date.toLocaleDateString(t("locale"), {
                    weekday: "short"
                });

                const card = document.createElement("div");
                card.className = "forecast-card";

                const day = document.createElement("h3");
                day.textContent = dayName;

                const icon = document.createElement("div");
                icon.className = "forecast-icon";
                icon.innerHTML = getWeatherIcon(daily.weather_code[i]);

                const condition = document.createElement("p");
                condition.textContent = getWeatherDescription(daily.weather_code[i]);

                const temperatures = document.createElement("div");
                temperatures.className = "forecast-temperatures";

                const max = document.createElement("span");
                max.className = "max-temp";
                max.textContent = `${Math.round(daily.temperature_2m_max[i])}°`;

                const min = document.createElement("span");
                min.className = "min-temp";
                min.textContent = `${Math.round(daily.temperature_2m_min[i])}°`;

                temperatures.append(max, min);
                card.append(day, icon, condition, temperatures);
                forecastContainer.appendChild(card);
            }
        }

        // SEARCH EVENTS

        searchButton.addEventListener("click", () => {
            searchCity(cityInput.value);
        });

        cityInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                searchCity(cityInput.value);
            }
        });

        // INITIAL

        document.querySelectorAll("[data-icon]").forEach(el => {
            el.innerHTML = svg(ICONS[el.dataset.icon]);
        });
        currentIcon.innerHTML = svg(ICONS.sun);
        sunProgressDot.innerHTML = '<svg viewBox="0 0 24 24" width="1em" height="1em"><circle cx="12" cy="12" r="7" fill="#11212D" stroke="#CCD0CF" stroke-width="2.5"/></svg>';

        applyTheme();
        applyLanguage();
        searchCity("Jeddah");
    </script>

</body>
</html>
